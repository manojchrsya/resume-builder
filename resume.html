  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {

  }

    width: var(--page-w);
    margin: 20px auto 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .toolbar-hint {
    font-size: 12px;
    color: #555;
    font-family: 'Lato', sans-serif;
  }
  .toolbar-actions { display: flex; gap: 8px; }
  .btn {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .3px;
    border-radius: 5px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    padding: 8px 14px;
    cursor: pointer;
    transition: opacity .15s ease;
  }
  .btn:hover { opacity: .85; }
  .btn.secondary {
    background: #fff;
    color: var(--accent);
  }
  .btn.tiny {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
  }
  .btn.danger {
    background: #fff;
    color: #b3261e;
    border-color: #e0b4b0;
  }

  /* ── PAGE WRAPPER ── */
  .page {
    width: var(--page-w);
    min-height: 1100px;
    margin: 14px auto 32px;
    background: #fff;
    box-shadow: 0 4px 32px rgba(0,0,0,.18);
  }

  /* ── HEADER ── */

    background: var(--accent);
    padding: 28px 36px 24px;
    color: #fff;
  }
  .header-name {
    font-family: 'EB Garamond', serif;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 1px;
    margin-bottom: 5px;
    color: #fff;
  }
  .header-title {
    font-size: 13px;
    font-weight: 300;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,255,255,.75);
    margin-bottom: 14px;
  }
  .header-contact {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 22px;
    font-size: 12px;
    font-weight: 300;
    color: rgba(255,255,255,.85);
  }
  .header-contact span {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .header-contact svg {
    width: 12px;
    height: 12px;
    fill: rgba(255,255,255,.65);
    flex-shrink: 0;
  }

  /* ── BODY ── */
  .body { padding: 24px 36px 36px; }

  /* ── SECTION ── */
  .section { margin-bottom: 20px; }
  .section-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 2px solid var(--rule);
    padding-bottom: 5px;
    margin-bottom: 12px;
  }
  .section-title {
    font-family: 'Lato', sans-serif;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
  }

  /* ── SUMMARY ── */
  .summary p {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    text-align: justify;
  }

  /* ── EXPERIENCE ── */
  .entry { margin-bottom: 14px; position: relative; }
  .entry:last-child { margin-bottom: 0; }
  .entry-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 2px;
  }
  .entry-role {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
  }
  .entry-date {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--light);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .entry-org {
    font-size: 14.5px;
    font-weight: 400;
    color: var(--accent);
    font-style: italic;
    margin-bottom: 5px;
    text-decoration: none;
  }
  .entry-location {
    font-size: 11.5px;
    color: var(--light);
  }
  .entry ul {
    padding-left: 16px;
    margin-top: 5px;
  }
  .entry ul li {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 3px;
    line-height: 1.6;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .entry ul li::marker { display: none; content: ''; }
  .entry ul { list-style: none; }
  .entry ul li::before {
    content: '•';
    color: var(--accent);
    flex-shrink: 0;
  }
  .li-text { flex: 1; }

  /* ── EDUCATION ── */
  .edu-entry { margin-bottom: 12px; position: relative; }
  .edu-entry:last-child { margin-bottom: 0; }
  .edu-degree {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text);
  }
  .edu-school {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--accent);
    font-style: italic;
  }
  .edu-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11.5px;
    color: var(--light);
    margin-top: 1px;
  }

  /* ── SKILLS ── */
  .skills-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 24px;
  }
  .skill-group { position: relative; }
  .skill-group-name {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
  }
  .skill-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    align-items: center;
  }
  .skill-tag {
    font-size: 11px;
    color: var(--muted);
    background: #f0f3f7;
    border: 1px solid #dde2ea;
    padding: 2px 8px;
    border-radius: 3px;
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  /* ── CERTIFICATIONS / PROJECTS ── */
  .cert-entry {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px dashed #e8e8e8;
    position: relative;
  }
  .cert-entry:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
  .cert-name {
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
  }
  .cert-issuer {
    font-size: 13px;
    color: var(--accent);
  }

  /* ── EDITABLE AFFORDANCES ── */
  [contenteditable="true"] {
    outline: none;
    border-radius: 3px;
    transition: background .12s ease, box-shadow .12s ease;
  }
  [contenteditable="true"]:hover {
    background: rgba(26,58,92,.06);
  }
  [contenteditable="true"]:focus {
    background: #fffbe6;
    box-shadow: 0 0 0 1px #e3c66a;
  }

  .add-row { display: flex; justify-content: flex-end; margin-top: 6px; }
  .remove-btn {
    border: none;
    background: transparent;
    color: #b3261e;
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 0 2px;
    opacity: .55;
  }
  .remove-btn:hover { opacity: 1; }
  .entry-remove {

    top: 0;

  .cert-remove { position: absolute; top: 0; right: -22px; }

  /* ── DIVIDER ── */

    height: 1px;
    background: #eaeaea;

  /* ── PRINT ── */
  @media print {
    body { background: #fff; }
    .page { margin: 0; box-shadow: none; width: 100%; }
    .toolbar, .add-row, .remove-btn, .entry-remove, .cert-remove, .edu-remove { display: none !important; }

</style>

    var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');

    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function setAtPath(obj, path, value) {
    var parts = path.replace(/\[(\d+)\]/g, '.$1').split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      cur = cur[parts[i]];
    }
    cur[parts[parts.length - 1]] = value;

  function renderHeaderAndSummary() {
    setText('[data-path="header.name"]', data.header.name);
    setText('[data-path="header.title"]', data.header.title);
    setText('[data-path="header.email"]', data.header.email);
    setText('[data-path="header.phone"]', data.header.phone);
    setText('[data-path="header.location"]', data.header.location);
    setText('[data-path="header.linkedin"]', data.header.linkedin);
    setText('[data-path="header.github"]', data.header.github);
    setText('[data-path="summary"]', data.summary);
  }
  function setText(selector, value) {
    var el = document.querySelector(selector);
    if (el && el.textContent !== value) el.textContent = value;
  }

  function renderSkills() {
    var grid = document.getElementById('skillsGrid');
    var html = '';
    data.skills.forEach(function (group, gi) {
      html += '<div class="skill-group">';
      html += '<div class="skill-group-name" contenteditable="true" data-path="skills[' + gi + '].title">' + esc(group.title) + '</div>';
      html += '<div class="skill-tags">';
      group.skills.forEach(function (tag, ti) {
        html += '<span class="skill-tag"><span contenteditable="true" data-path="skills[' + gi + '].skills[' + ti + ']">' + esc(tag) + '</span>' +
                '<button class="remove-btn" title="Remove skill" data-action="remove-skill" data-gi="' + gi + '" data-ti="' + ti + '">&times;</button></span>';
      });
      html += '</div>';
      html += '<div class="add-row">' +
              '<button class="btn tiny secondary" data-action="add-skill" data-gi="' + gi + '">+ Skill</button>&nbsp;' +
              '<button class="btn tiny danger" data-action="remove-skill-group" data-gi="' + gi + '">Remove Group</button>' +
              '</div>';
      html += '</div>';
    });
    grid.innerHTML = html;
  }

  function renderExperience() {
    var list = document.getElementById('experienceList');
    var html = '';
    data.experience.forEach(function (exp, ei) {
      html += '<div class="entry">';
      html += '<button class="remove-btn entry-remove" title="Remove company" data-action="remove-experience" data-ei="' + ei + '">&times;</button>';
      html += '<div class="entry-header" style="margin-bottom:6px;">';
      html += '<div class="entry-org" style="font-style:normal; font-weight:700; font-size:13.5px; color:var(--text);">' +
              '<span contenteditable="true" data-path="experience[' + ei + '].company">' + esc(exp.company) + '</span>' +
              ' &nbsp;·&nbsp; <span style="font-weight:400; font-size:12px; color:var(--light);" contenteditable="true" data-path="experience[' + ei + '].location">' + esc(exp.location) + '</span></div>';
      html += '<div class="entry-date" contenteditable="true" data-path="experience[' + ei + '].duration">' + esc(exp.duration) + '</div>';
      html += '</div>';

      exp.designations.forEach(function (des, di) {
        var isLast = di === exp.designations.length - 1;
        var borderColor = di === 0 ? 'var(--accent)' : '#d1d5db';
        html += '<div style="padding-left:14px; border-left:2px solid ' + borderColor + '; margin-bottom:' + (isLast ? '2px' : '10px') + '; position:relative;">';
        html += '<button class="remove-btn" style="position:absolute; top:0; right:-20px;" title="Remove role" data-action="remove-designation" data-ei="' + ei + '" data-di="' + di + '">&times;</button>';
        html += '<div class="entry-header">';
        html += '<div style="display:flex; align-items:center; gap:8px;">';
        html += '<div class="entry-role" contenteditable="true" data-path="experience[' + ei + '].designations[' + di + '].title">' + esc(des.title) + '</div>';
        if (des.promoted) {
          html += '<span style="font-size:10px; font-weight:700; background:#e8f0fe; color:#1a3a5c; padding:1px 7px; border-radius:3px; letter-spacing:.5px; text-transform:uppercase;">Promoted</span>';
        }
        html += '</div>';
        html += '<div class="entry-date" contenteditable="true" data-path="experience[' + ei + '].designations[' + di + '].duration">' + esc(des.duration) + '</div>';
        html += '</div>';
        html += '<ul>';
        des.responsibilities.forEach(function (resp, ri) {
          html += '<li><span class="li-text" contenteditable="true" data-path="experience[' + ei + '].designations[' + di + '].responsibilities[' + ri + ']">' + esc(resp) + '</span>' +
                  '<button class="remove-btn" title="Remove line" data-action="remove-responsibility" data-ei="' + ei + '" data-di="' + di + '" data-ri="' + ri + '">&times;</button></li>';
        });
        html += '</ul>';
        html += '<div class="add-row"><button class="btn tiny secondary" data-action="add-responsibility" data-ei="' + ei + '" data-di="' + di + '">+ Line</button></div>';
        html += '</div>';
      });

      html += '<div class="add-row"><button class="btn tiny secondary" data-action="add-designation" data-ei="' + ei + '">+ Role at this company</button></div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }

  function renderProjects() {
    var list = document.getElementById('projectsList');
    var html = '';
    data.projects.forEach(function (proj, pi) {
      html += '<div class="cert-entry">';
      html += '<button class="remove-btn cert-remove" title="Remove project" data-action="remove-project" data-pi="' + pi + '">&times;</button>';
      html += '<div style="width:100%;">';
      html += '<div class="cert-name" contenteditable="true" data-path="projects[' + pi + '].name">' + esc(proj.name) + '</div>';
      html += '<div class="cert-issuer" contenteditable="true" data-path="projects[' + pi + '].description">' + esc(proj.description) + '</div>';
      html += '<div style="margin-top:4px;"><strong>Tech Stack:</strong> <span contenteditable="true" data-path="projects[' + pi + '].techStack" data-list="comma">' + esc(proj.techStack.join(', ')) + '</span></div>';
      html += '</div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }

  function renderEducation() {
    var list = document.getElementById('educationList');
    var html = '';
    data.education.forEach(function (edu, edi) {
      html += '<div class="edu-entry">';
      html += '<button class="remove-btn edu-remove" title="Remove education" data-action="remove-education" data-edi="' + edi + '">&times;</button>';
      html += '<div class="edu-degree" contenteditable="true" data-path="education[' + edi + '].title">' + esc(edu.title) + '</div>';
      html += '<div class="edu-school" contenteditable="true" data-path="education[' + edi + '].institution">' + esc(edu.institution) + '</div>';
      html += '<div class="edu-meta">' +
              '<span contenteditable="true" data-path="education[' + edi + '].location">' + esc(edu.location) + '</span>' +
              '<span><span contenteditable="true" data-path="education[' + edi + '].year">' + esc(edu.year) + '</span> &nbsp;·&nbsp; Scored <span contenteditable="true" data-path="education[' + edi + '].percentage">' + esc(edu.percentage) + '</span></span>' +
              '</div>';
      html += '</div>';
    });
    list.innerHTML = html;
  }

  // ---- Editing: update model on input, without full re-render ----
  document.addEventListener('input', function (e) {
    var el = e.target;
    if (!el.hasAttribute || !el.hasAttribute('contenteditable')) return;
    var path = el.getAttribute('data-path');
    if (!path) return;
    var value = el.textContent;
    if (el.getAttribute('data-list') === 'comma') {
      value = value.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
    }
    setAtPath(data, path, value);
    saveData();
  });

  // ---- Structural actions ----
  document.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-action]');
    if (!btn) return;
    var action = btn.getAttribute('data-action');

    if (action === 'add-skill-group') {
      data.skills.push({ title: 'New Skill Group', skills: ['New Skill'] });
    } else if (action === 'remove-skill-group') {
      data.skills.splice(+btn.dataset.gi, 1);
    } else if (action === 'add-skill') {
      data.skills[+btn.dataset.gi].skills.push('New Skill');
    } else if (action === 'remove-skill') {
      data.skills[+btn.dataset.gi].skills.splice(+btn.dataset.ti, 1);

    } else if (action === 'add-experience') {
      data.experience.push({
        company: 'New Company', url: '', location: 'City, Country', duration: 'Mon YYYY — Present',
        designations: [{ title: 'Job Title', duration: 'Mon YYYY — Present', promoted: false, responsibilities: ['Describe an achievement or responsibility.'] }]
      });
    } else if (action === 'remove-experience') {
      data.experience.splice(+btn.dataset.ei, 1);
    } else if (action === 'add-designation') {
      data.experience[+btn.dataset.ei].designations.unshift({ title: 'New Role', duration: 'Mon YYYY — Present', promoted: true, responsibilities: ['Describe an achievement or responsibility.'] });
    } else if (action === 'remove-designation') {
      data.experience[+btn.dataset.ei].designations.splice(+btn.dataset.di, 1);
    } else if (action === 'add-responsibility') {
      data.experience[+btn.dataset.ei].designations[+btn.dataset.di].responsibilities.push('New line item.');
    } else if (action === 'remove-responsibility') {
      data.experience[+btn.dataset.ei].designations[+btn.dataset.di].responsibilities.splice(+btn.dataset.ri, 1);

    } else if (action === 'add-project') {
      data.projects.push({ name: 'New Project', description: 'Describe the project.', techStack: ['Tech'] });
    } else if (action === 'remove-project') {
      data.projects.splice(+btn.dataset.pi, 1);

    } else if (action === 'add-education') {
      data.education.push({ title: 'Degree / Certificate', institution: 'Institution Name', location: 'City, Country', year: 'Year', percentage: '' });
    } else if (action === 'remove-education') {
      data.education.splice(+btn.dataset.edi, 1);
    } else {
      return;
    }

    saveData();
    renderAll();
  });

  // ---- Reset ----
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (!confirm('Reset all edits back to the original resume data? This cannot be undone.')) return;
    data = JSON.parse(JSON.stringify(defaultData));
    saveData();
    renderAll();
  });

  // ---- CSV export ----
  function csvEscape(val) {
    var s = String(val == null ? '' : val);
    if (/[",\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }

  function buildCsv() {
    var rows = [['Section', 'Field 1', 'Field 2', 'Field 3', 'Field 4']];

    rows.push(['Personal Info', 'Name', data.header.name, '', '']);
    rows.push(['Personal Info', 'Title', data.header.title, '', '']);
    rows.push(['Personal Info', 'Email', data.header.email, '', '']);
    rows.push(['Personal Info', 'Phone', data.header.phone, '', '']);
    rows.push(['Personal Info', 'Location', data.header.location, '', '']);
    rows.push(['Personal Info', 'LinkedIn', data.header.linkedin, '', '']);
    rows.push(['Personal Info', 'GitHub', data.header.github, '', '']);

    rows.push(['Summary', '', data.summary, '', '']);

    data.skills.forEach(function (g) {
      rows.push(['Skills', g.title, g.skills.join('; '), '', '']);
    });

    data.experience.forEach(function (exp) {
      exp.designations.forEach(function (des) {
        rows.push(['Experience', exp.company, des.title, des.responsibilities.join(' | '), des.duration]);
      });
    });

    data.projects.forEach(function (p) {
      rows.push(['Project', p.name, p.techStack.join(', '), p.description, '']);
    });

    data.education.forEach(function (edu) {
      rows.push(['Education', edu.title, edu.institution, edu.location, edu.year + (edu.percentage ? ' - ' + edu.percentage : '')]);
    });

    return rows.map(function (r) { return r.map(csvEscape).join(','); }).join('\r\n');
  }

  document.getElementById('downloadCsvBtn').addEventListener('click', function () {
    var csv = buildCsv();
    var blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    var fileName = (data.header.name || 'resume').trim().replace(/\s+/g, '_') + '_resume.csv';
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  renderAll();
})();
</script>
</body>
</html>
